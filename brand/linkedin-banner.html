<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn Banner — Alul</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* LinkedIn banner: 1584 x 396. The profile photo covers the bottom-left,
     so all content sits in the right half. Same "Spec Sheet" direction as the site:
     cool paper + faint dot grid, graphite text, one soft cobalt accent. */
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1584px;
        height: 396px;
      }
      body {
        position: relative;
        overflow: hidden;
        background-color: oklch(0.975 0.004 250);
        background-image: radial-gradient(
          circle at 1px 1px,
          oklch(0.225 0.013 258 / 0.1) 1px,
          transparent 0
        );
        background-size: 24px 24px;
        font-family: "IBM Plex Sans", sans-serif;
        color: oklch(0.225 0.013 258);
      }

      .content {
        position: absolute;
        right: 88px;
        top: 50%;
        transform: translateY(-50%);
        width: 1000px;
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 48px;
        align-items: end;
      }
      .label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 15px;
        color: oklch(0.56 0.014 256);
      }
      .label b {
        font-weight: 400;
        color: oklch(0.48 0.14 262);
      }
      h1 {
        margin-top: 14px;
        font-size: 72px;
        line-height: 0.95;
        letter-spacing: -0.05em;
        font-weight: 300;
      }
      h1 small {
        font-family: "IBM Plex Mono", monospace;
        font-size: 17px;
        letter-spacing: 0;
        vertical-align: top;
        margin-left: 8px;
        color: oklch(0.48 0.14 262);
      }
      .tagline {
        margin-top: 16px;
        font-size: 20px;
        font-weight: 300;
        line-height: 1.4;
        color: oklch(0.38 0.016 258);
      }

      .spec {
        position: relative;
        border: 1px solid oklch(0.225 0.013 258 / 0.1);
        background: oklch(0.975 0.004 250 / 0.8);
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
      }
      .spec div {
        display: grid;
        grid-template-columns: 104px 1fr;
        gap: 12px;
        padding: 10px 14px;
      }
      .spec div + div {
        border-top: 1px solid oklch(0.225 0.013 258 / 0.08);
      }
      .spec dt {
        color: oklch(0.56 0.014 256);
      }
      .spec dd {
        margin: 0;
        color: oklch(0.29 0.015 258);
      }
      /* Tanda registrasi "+" di sudut, seperti di situs. */
      .cross {
        position: absolute;
        width: 11px;
        height: 11px;
      }
      .cross::before,
      .cross::after {
        content: "";
        position: absolute;
        background: oklch(0.7 0.012 255);
      }
      .cross::before {
        top: 5px;
        left: 0;
        width: 11px;
        height: 1px;
      }
      .cross::after {
        left: 5px;
        top: 0;
        width: 1px;
        height: 11px;
      }
      .tl {
        top: -6px;
        left: -6px;
      }
      .tr {
        top: -6px;
        right: -6px;
      }
      .bl {
        bottom: -6px;
        left: -6px;
      }
      .br {
        bottom: -6px;
        right: -6px;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <div>
        <p class="label"><b>01</b> / software engineer</p>
        <h1>Fazlur Rahman<small>(alul)</small></h1>
        <p class="tagline">I build scalable, high-performance web products.</p>
      </div>
      <dl class="spec">
        <span class="cross tl"></span><span class="cross tr"></span>
        <span class="cross bl"></span><span class="cross br"></span>
        <div>
          <dt>based in</dt>
          <dd>Jember, Indonesia · UTC+7</dd>
        </div>
        <div>
          <dt>experience</dt>
          <dd>5+ years</dd>
        </div>
        <div>
          <dt>stack</dt>
          <dd>Next.js · React · GraphQL</dd>
        </div>
        <div>
          <dt>site</dt>
          <dd>alul.vercel.app</dd>
        </div>
      </dl>
    </div>
  </body>
</html>
